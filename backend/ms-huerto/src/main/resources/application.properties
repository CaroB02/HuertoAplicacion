spring.application.name=ms-huerto
# Cada microservicio corre en su propio puerto
server.port=8082

# Base de datos propia de este microservicio (MySQL de Laragon o XAMPP).
# createDatabaseIfNotExist=true crea la base sola la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_huerto?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# update = Hibernate crea y ajusta las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta (sirve para explicar la persistencia en la defensa)
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dirección de ms-tareas: ms-huerto le pregunta si un sector o cultivo tiene tareas
# o reportes antes de permitir borrarlo (comunicación entre microservicios)
servicios.tareas.url=http://localhost:8083
